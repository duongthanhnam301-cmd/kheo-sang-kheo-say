<style>
body{margin:0;background:#1b1442}
a{color:#ffe98a}a:hover{color:#fff4c7}
.kss *{box-sizing:border-box}
.kss button{font-family:inherit;cursor:pointer}
.kss button:focus-visible,.kss input:focus-visible{outline:3px solid #ffe98a;outline-offset:3px}
/* ---------- ambient decor ---------- */
.decor{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff6cf;box-shadow:0 0 6px 1px rgba(255,240,180,.55);animation:twinkle 4s ease-in-out infinite}
.star.big{box-shadow:0 0 10px 3px rgba(255,236,160,.55)}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.sparkle{position:absolute;animation:spark 5.5s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,240,170,.8))}
@keyframes spark{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.moon{position:absolute;right:-130px;top:-170px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fffde6 0%,#fff3a6 48%,#f7dd78 70%,#f3cf62 100%);box-shadow:0 0 80px 30px rgba(255,236,150,.28),0 0 200px 90px rgba(255,220,140,.12);animation:glow 9s ease-in-out infinite;opacity:.92}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 62%,rgba(230,200,110,.35) 0 9%,transparent 10%),radial-gradient(circle at 58% 72%,rgba(230,200,110,.3) 0 6%,transparent 7%),radial-gradient(circle at 26% 30%,rgba(230,200,110,.25) 0 5%,transparent 6%)}
@keyframes glow{0%,100%{box-shadow:0 0 80px 30px rgba(255,236,150,.26),0 0 200px 90px rgba(255,220,140,.1)}50%{box-shadow:0 0 110px 44px rgba(255,236,150,.36),0 0 240px 110px rgba(255,220,140,.16)}}
.cloud{position:absolute;opacity:.9}
.cloud svg{display:block;width:100%;height:auto}
.c1{width:300px;left:-70px;bottom:-24px;animation:drift 38s ease-in-out infinite alternate}
.c2{width:240px;left:7%;bottom:-46px;opacity:.85;animation:drift 46s ease-in-out infinite alternate-reverse}
.c3{width:260px;right:-60px;bottom:-30px;animation:drift 42s ease-in-out infinite alternate-reverse}
.c4{width:200px;right:12%;bottom:-54px;opacity:.8;animation:drift 52s ease-in-out infinite alternate}
.c5{width:190px;left:-50px;top:96px;opacity:.55;animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(46px,-8px)}100%{transform:translate(90px,0)}}
.note{position:absolute;bottom:-60px;opacity:0;animation:rise 16s linear infinite}
.note svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
@keyframes rise{0%{transform:translate(0,0) rotate(-8deg);opacity:0}10%{opacity:.85}50%{transform:translate(26px,-48vh) rotate(10deg)}85%{opacity:.6}100%{transform:translate(-8px,-96vh) rotate(-6deg);opacity:0}}
.still .star,.still .sparkle,.still .moon,.still .cloud,.still .note{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.star,.sparkle,.moon,.cloud,.note{animation:none!important}.note{display:none}}
/* ---------- book ---------- */
.stage{perspective:2600px}
.book{position:relative;transition:transform .85s cubic-bezier(.45,.05,.3,1)}
.book.double{width:min(94vw,calc((100vh - 200px) * 1.4085));aspect-ratio:1.4085}
.book.single{width:min(90vw,calc((100vh - 200px) * .7042));aspect-ratio:.7042}
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background:#fffaf0}
.double .half.l{left:0;border-radius:6px 0 0 6px}
.double .half.r{right:0;border-radius:0 6px 6px 0}
.single .half{left:0;width:100%;border-radius:4px 8px 8px 4px}
.half.empty{background:transparent}
.half img,.face img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.double .half.l::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,rgba(40,20,60,.28) 0,rgba(40,20,60,.08) 3.5%,rgba(255,255,255,0) 9%)}
.double .half.r::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(40,20,60,.3) 0,rgba(40,20,60,.08) 3.5%,rgba(255,255,255,0) 9%)}
.single .half::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(40,20,60,.22) 0,rgba(255,255,255,0) 5%)}
.bookshadow{position:absolute;left:3%;right:3%;bottom:-26px;height:40px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(8,4,24,.6),rgba(8,4,24,0) 70%);filter:blur(4px)}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:5;animation-duration:.85s;animation-timing-function:cubic-bezier(.45,.05,.3,1);animation-fill-mode:both}
.leaf.nd{left:50%;transform-origin:left center;animation-name:turnNext}
.leaf.pd{left:0;transform-origin:right center;animation-name:turnPrev}
.single .leaf{left:0;width:100%;transform-origin:left center}
.leaf.ns{animation-name:turnNextS}
.leaf.ps{animation-name:turnPrevS}
@keyframes turnNext{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes turnPrev{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
@keyframes turnNextS{0%{transform:rotateY(0);opacity:1}70%{opacity:1}100%{transform:rotateY(-180deg);opacity:0}}
@keyframes turnPrevS{0%{transform:rotateY(-180deg);opacity:0}30%{opacity:1}100%{transform:rotateY(0);opacity:1}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fffaf0}
.face.back{transform:rotateY(180deg)}
.face.paper{background:linear-gradient(to left,#f3e9d2,#fffaf0 40%)}
.face .shade{position:absolute;inset:0;pointer-events:none;animation:shadeIn .85s ease-in-out both}
.face.front .shade{background:linear-gradient(to left,rgba(30,10,50,.38),rgba(30,10,50,0) 60%)}
.leaf.pd .face.front .shade{background:linear-gradient(to right,rgba(30,10,50,.38),rgba(30,10,50,0) 60%)}
.face.back .shade{background:linear-gradient(to right,rgba(30,10,50,.38),rgba(30,10,50,0) 60%);animation-name:shadeOut}
.leaf.pd .face.back .shade{background:linear-gradient(to left,rgba(30,10,50,.38),rgba(30,10,50,0) 60%)}
@keyframes shadeIn{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
@keyframes shadeOut{0%{opacity:1}50%{opacity:1}100%{opacity:0}}
.hit{position:absolute;top:0;bottom:0;width:50%;background:transparent;border:0;padding:0;z-index:8}
.hit.l{left:0;cursor:w-resize}.hit.r{right:0;cursor:e-resize}
.hit:disabled{cursor:default}
.hit:not(:disabled):hover{background:radial-gradient(ellipse at var(--hx) 50%,rgba(255,240,180,.10),rgba(255,240,180,0) 55%)}
.hit.l{--hx:0%}.hit.r{--hx:100%}
.corner{position:absolute;bottom:0;width:46px;height:46px;pointer-events:none;z-index:6;opacity:.85;transition:opacity .3s}
.corner.r{right:0;background:linear-gradient(135deg,rgba(255,255,255,0) 50%,rgba(240,226,196,.95) 51%,#fffaf0 100%);border-radius:0 0 6px 0;box-shadow:-2px -2px 6px rgba(40,20,60,.18);animation:peel 3.6s ease-in-out infinite}
@keyframes peel{0%,100%{width:30px;height:30px}50%{width:44px;height:44px}}
.still .corner{animation:none}

/* ---------- per-page motion ---------- */
.fxlayer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.fx{position:absolute;transform:translate(-50%,-50%);display:block}
.fx.full{left:0!important;top:0!important;width:100%!important;height:100%;transform:none}
.fxi{display:block;width:100%;animation-fill-mode:both}
.fxi svg{display:block;width:100%;height:auto;overflow:visible}
.fxi.spark{animation-fill-mode:both,none;animation-name:fxPop,fxTw;animation-duration:.7s,3.2s;animation-timing-function:cubic-bezier(.3,1.6,.5,1),ease-in-out;animation-iteration-count:1,infinite;filter:drop-shadow(0 0 4px rgba(255,240,170,.9))}
.fxi.star{animation-fill-mode:both,none;animation-name:fxPop,fxTw;animation-duration:.9s,4.4s;animation-timing-function:ease-out,ease-in-out;animation-iteration-count:1,infinite;filter:drop-shadow(0 0 5px rgba(255,245,200,.95))}
.fxi.note{animation-fill-mode:both,none;animation-name:fxPop,fxBob;animation-duration:.8s,3.4s;animation-timing-function:cubic-bezier(.3,1.6,.5,1),ease-in-out;animation-iteration-count:1,infinite;filter:drop-shadow(0 2px 3px rgba(40,20,60,.25))}
.fxi.rise{animation-name:fxRise;animation-duration:6.5s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}
.fxi.halo{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,246,190,0) 55%,rgba(255,240,160,.35) 68%,rgba(255,240,160,0) 76%);animation-name:fxHalo;animation-duration:4.5s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.fxi.sweep{height:100%;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,252,235,.55) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;background-repeat:no-repeat;animation-name:fxSweep;animation-duration:1.5s;animation-timing-function:ease-out;opacity:0}
@keyframes fxPop{0%{opacity:0;transform:scale(0) rotate(-30deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes fxTw{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.35;transform:scale(.6) rotate(20deg)}}
@keyframes fxBob{0%,100%{transform:translateY(0) rotate(-6deg)}25%{transform:translateY(-18%) rotate(4deg)}50%{transform:translateY(0) rotate(-2deg)}75%{transform:translateY(-8%) rotate(6deg)}}
@keyframes fxRise{0%{opacity:0;transform:translate(0,0) rotate(-8deg)}15%{opacity:.95}80%{opacity:.7}100%{opacity:0;transform:translate(30%,-520%) rotate(10deg)}}
@keyframes fxHalo{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
@keyframes fxSweep{0%{opacity:1;background-position:100% 0}100%{opacity:1;background-position:0 0}}
.still .fxi{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.fxlayer{display:none}}

/* ---------- living pages: real book elements in motion ---------- */
.live{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.lvb,.lvl{position:absolute;display:block;background-repeat:no-repeat}
.lvb{inset:0}
.lvl{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-fill-mode:backwards;will-change:transform}
.m-drift-r{animation-name:lvDriftR;animation-duration:10s;transform-origin:100% 50%}
.m-drift-l{animation-name:lvDriftL;animation-duration:9s;transform-origin:0 50%}
.m-drift-b{animation-name:lvDriftB;animation-duration:11s;transform-origin:50% 100%}
.m-drift-t{animation-name:lvDriftT;animation-duration:10s;transform-origin:50% 0}
.m-float{animation-name:lvFloat;animation-duration:6.5s}
.m-sway{animation-name:lvSway;animation-duration:3.6s;transform-origin:50% 97%}
.m-swing{animation-name:lvSwing;animation-duration:4.2s;transform-origin:50% 6%}
.m-bob{animation-name:lvBob;animation-duration:3.8s}
.m-hop{animation-name:lvHop;animation-duration:2.8s;transform-origin:50% 100%}
.m-wobble{animation-name:lvWobble;animation-duration:3s;transform-origin:50% 92%}
.m-twinkle{animation-name:lvTwinkle;animation-duration:3.2s}
.m-wave{animation-name:lvWave;animation-duration:5.5s;transform-origin:50% 50%}
.m-chug{animation-name:lvChug;animation-duration:1.1s}
.m-breathe-l{animation-name:lvBreathe;animation-duration:6s;transform-origin:0 50%}
.m-breathe-r{animation-name:lvBreathe;animation-duration:6s;transform-origin:100% 50%}
.m-breathe-t{animation-name:lvBreathe;animation-duration:6s;transform-origin:50% 0}
.m-breathe-b{animation-name:lvBreathe;animation-duration:6s;transform-origin:50% 100%}
@keyframes lvDriftR{0%,100%{transform:translate(0,0)}50%{transform:translate(4%,-2%)}}
@keyframes lvDriftL{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-6%,1.5%) rotate(-1.5deg)}}
@keyframes lvDriftB{0%,100%{transform:translate(0,0)}50%{transform:translate(2.5%,4%)}}
@keyframes lvDriftT{0%,100%{transform:translate(0,0)}50%{transform:translate(2.5%,-4%)}}
@keyframes lvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}
@keyframes lvSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
@keyframes lvSwing{0%,100%{transform:rotate(0)}25%{transform:rotate(1.8deg)}75%{transform:rotate(-1.8deg)}}
@keyframes lvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes lvHop{0%,40%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.04,.95)}24%{transform:translateY(-9%) scale(.98,1.03)}34%{transform:translateY(0) scale(1.03,.97)}}
@keyframes lvWobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes lvTwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.92)}}
@keyframes lvWave{0%,100%{transform:translateY(0) skewY(0)}25%{transform:translateY(-1.6%) skewY(1.2deg)}75%{transform:translateY(1.6%) skewY(-1.2deg)}}
@keyframes lvChug{0%,100%{transform:translate(0,0)}50%{transform:translate(.5%,-.7%)}}
@keyframes lvBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.still .lvl{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.lvl{animation:none!important}}

/* ---------- controls ---------- */
.ctl{min-width:48px;min-height:48px;border-radius:999px;border:1.5px solid rgba(255,244,199,.35);background:rgba(27,18,66,.55);color:#fff4c7;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-size:15px;font-weight:600;transition:background .2s,transform .2s,border-color .2s;backdrop-filter:blur(6px)}

function fxRng(seed) { let x = (seed * 2654435761) % 4294967296; return function () { x = (x * 1664525 + 1013904223) % 4294967296; return x / 4294967296; }; }
function fxKind(k) {
  if (k === 1) return 'cover';
  if (k >= 28 && k <= 75 && k % 2 === 1) return 'tip';
  if ([2, 3, 7, 8, 9, 20, 21, 23, 24, 27, 76, 77, 120, 121].indexOf(k) >= 0) return 'plate';
  return 'none';
}
function fxFor(k) {
  const r = fxRng(k * 31 + 7), out = [];
  const PAL = ['#4fb7c4', '#f2b630', '#e2629f', '#8c6fd6'];
  const add = (t, x, y, s, d, c) => {
    const d2 = (d + (t === 'star' ? 0.9 : 0.75)).toFixed(2);
    out.push({ t: t, o: t === 'sweep' ? 'full' : '', x: x.toFixed(1), y: y.toFixed(1), s: s.toFixed(1), c: c || '#fff3b0',
      d: (t === 'spark' || t === 'star' || t === 'note') ? d.toFixed(2) + 's, ' + d2 + 's' : d.toFixed(2) + 's',
      note: t === 'note' || t === 'rise', spark: t === 'spark', star: t === 'star' });
  };
  const kind = fxKind(k);
  if (kind === 'none') return out;
  add('sweep', 0, 0, 100, 0.1);
  if (kind === 'plate') return out;
  if (kind === 'cover') {
    for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2 + 0.3; add('spark', 50 + 41 * Math.cos(a), 31.5 + 29 * Math.sin(a), 3 + r() * 2.8, 0.25 + i * 0.14); }
    add('rise', 66, 74, 4.5, 0.6, '#8fdde0'); add('rise', 74, 68, 3.8, 2.6, '#ffd86b'); add('rise', 60, 66, 3.4, 4.2, '#f39ac7');
  } else if (kind === 'back') {
    add('halo', 50, 12.5, 34, 0.1);
    for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; add('spark', 50 + 21 * Math.cos(a), 12.5 + 14 * Math.sin(a), 2.6 + r() * 2, 0.3 + i * 0.15); }
    for (let i = 0; i < 6; i++) add('star', 8 + r() * 84, 26 + r() * 22, 1.8 + r() * 1.6, 0.6 + i * 0.2);
  } else if (kind === 'part' || kind === 'scene') {
    const n = kind === 'part' ? 7 : 10;
    for (let i = 0; i < n; i++) add('spark', 8 + r() * 84, 6 + r() * 80, 2.4 + r() * 3, 0.2 + i * 0.12);
    for (let i = 0; i < 3; i++) add('rise', 15 + r() * 70, 88 + r() * 6, 4 + r() * 2.5, 0.4 + i * 2.1, PAL[i % 4]);
  } else if (kind === 'play') {
    const spots = [[11, 40], [89, 45], [13, 83], [87, 80]];
    spots.forEach((p, i) => add('note', p[0] + (r() - 0.5) * 4, p[1] + (r() - 0.5) * 5, 5.5 + r() * 2, 0.2 + i * 0.16, PAL[(i + k) % 4]));
    add('spark', 74 + r() * 12, 8 + r() * 4, 3.4, 0.9); add('spark', 18 + r() * 10, 10 + r() * 4, 2.6, 1.1);
  } else if (kind === 'lull') {
    const SC = ['#f2b630', '#8c6fd6', '#e2629f'];
    for (let i = 0; i < 7; i++) add('star', 8 + r() * 84, 3 + r() * 17, 1.8 + r() * 1.8, 0.2 + i * 0.22, SC[i % 3]);
    add('note', 90, 36, 4.6, 1.2, '#8c6fd6');
  } else if (kind === 'tip' || kind === 'tipn') {
    const t = kind === 'tip' ? 'spark' : 'star';
    for (let i = 0; i < 3; i++) add(t, 12 + r() * 76, 4 + r() * 8, 2.2 + r() * 1.6, 0.3 + i * 0.18, kind === 'tip' ? '#f2b630' : ['#f2b630', '#8c6fd6', '#e2629f'][i % 3]);
  } else {
    add('spark', 7, 4.5, 2.6, 0.4, '#f2b630'); add('spark', 93, 4.5, 2.2, 0.6, '#e2629f');
  }
  return out;
}
